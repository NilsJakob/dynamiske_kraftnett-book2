<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital tvilling</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #f0f0f0;
    font-family: "Times New Roman", serif;
}

.figure {
    position: relative;
    width: 900px;
    height: 800px;
    margin: auto;
    background: #f0f0f0;
}

/* Tittel */
.title {
    text-align: center;
    font-size: 64px;
    margin-bottom: 20px;
}

/* Akser */
.x-axis {
    position: absolute;
    left: 80px;
    bottom: 60px;
    width: 780px;
    height: 2px;
    background: black;
}

.x-axis::after {
    content: "";
    position: absolute;
    right: -12px;
    top: -5px;
    border-left: 12px solid black;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
}

.y-axis {
    position: absolute;
    left: 80px;
    bottom: 60px;
    width: 2px;
    height: 680px;
    background: black;
}

.y-axis::after {
    content: "";
    position: absolute;
    top: -12px;
    left: -5px;
    border-bottom: 12px solid black;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
}

/* Aksetitler */
.xlabel {
    position: absolute;
    bottom: 0;
    left: 350px;
    font-size: 48px;
}

.ylabel {
    position: absolute;
    left: 5px;
    top: 140px;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 48px;
}

/* Blå bokser */
.level {
    position: absolute;
    background: #12ADE8;
    border: 2px solid black;
    text-align: center;
    font-size: 38px;
    padding: 10px 20px;
    box-sizing: border-box;
}

/* Undertekster */
.subtitle {
    position: absolute;
    font-size: 42px;
}

/* Nivå 1 */
.model {
    left: 80px;
    bottom: 170px;
    width: 360px;
}

.model-sub {
    left: 100px;
    bottom: 105px;
}

/* Nivå 2 */
.partial {
    left: 290px;
    bottom: 345px;
    width: 380px;
}

.partial-sub {
    left: 270px;
    bottom: 275px;
}

/* Nivå 3 */
.full {
    left: 470px;
    bottom: 515px;
    width: 360px;
}

.full-sub {
    left: 545px;
    bottom: 445px;
}
</style>
</head>

<body>

<div class="figure">

    <div class="title">Digital tvilling</div>

    <div class="y-axis"></div>
    <div class="x-axis"></div>

    <div class="ylabel">Kompleksitet</div>
    <div class="xlabel">Integrasjon</div>

    <div class="level model">Digital modell</div>
    <div class="subtitle model-sub">Representasjon</div>

    <div class="level partial">Delvis integrert</div>
    <div class="subtitle partial-sub">Tilstandsestimering</div>

    <div class="level full">Fullt integrert</div>
    <div class="subtitle full-sub">Prediktiv</div>

</div>

</body>
</html>
