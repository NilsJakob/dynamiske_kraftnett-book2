
<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="300"
     viewBox="0 0 900 300">

  <style>
    text {
      font-family: "Times New Roman", serif;
      font-size: 24px;
    }

    .line {
      stroke: black;
      stroke-width: 3;
      fill: none;
    }

    .bus {
      stroke: black;
      stroke-width: 3;
    }

    .reactor {
      fill: white;
      stroke: black;
      stroke-width: 2;
    }

    .label {
      font-style: italic;
      font-size: 30px;
    }
  </style>

  <!-- Generator -->

  <circle cx="80"
          cy="140"
          r="28"
          fill="white"
          stroke="black"
          stroke-width="2"/>

  <!-- Sinus-symbol -->
  <path d="
      M60 140
      C65 130,75 130,80 140
      C85 150,95 150,100 140"
      fill="none"
      stroke="black"
      stroke-width="2.5"
      stroke-linecap="round"/>

  <!-- Generator connection -->
  <line x1="108"
        y1="140"
        x2="140"
        y2="140"
        class="line"/>

  <!-- Transformer -->

  <!-- Left winding -->
  <path d="
      M150 100
      a10 10 0 0 1 0 20
      a10 10 0 0 1 0 20
      a10 10 0 0 1 0 20
      a10 10 0 0 1 0 20"
      fill="none"
      stroke="black"
      stroke-width="3"/>

  <!-- Right winding -->
  <path d="
      M190 100
      a10 10 0 0 0 0 20
      a10 10 0 0 0 0 20
      a10 10 0 0 0 0 20
      a10 10 0 0 0 0 20"
      fill="none"
      stroke="black"
      stroke-width="3"/>

  <!-- Transformer connection to bus -->
  <line x1="190"
        y1="140"
        x2="250"
        y2="140"
        class="line"/>

  <!-- Labels -->

  <text x="150"
        y="80"
        class="label">j0.1</text>

  <text x="5"
        y="210"
        class="label">X′d = 0.20</text>

  <!-- Left bus -->

  <line x1="250"
        y1="20"
        x2="250"
        y2="280"
        class="bus"/>

  <!-- Top transmission path -->

  <line x1="250"
        y1="65"
        x2="760"
        y2="65"
        class="line"/>

  <rect x="270"
        y="48"
        width="34"
        height="34"
        class="reactor"/>

  <rect x="705"
        y="48"
        width="34"
        height="34"
        class="reactor"/>

  <text x="485"
        y="48"
        class="label">j0.4</text>

  <!-- Bottom transmission path -->

  <line x1="250"
        y1="225"
        x2="760"
        y2="225"
        class="line"/>

  <rect x="270"
        y="208"
        width="34"
        height="34"
        class="reactor"/>

  <rect x="705"
        y="208"
        width="34"
        height="34"
        class="reactor"/>

  <text x="485"
        y="272"
        class="label">j0.4</text>


  <!-- Right bus -->

  <line x1="760"
        y1="20"
        x2="760"
        y2="280"
        class="bus"/>

  <!-- Infinite bus connection -->

  <line x1="760"
        y1="140"
        x2="810"
        y2="140"
        class="line"/>

  <!-- Infinite bus symbol -->

  <circle cx="845"
          cy="140"
          r="28"
          fill="white"
          stroke="black"
          stroke-width="2"/>

  <text x="826"
        y="154"
        style="font-size:40px;">∞</text>

</svg>
