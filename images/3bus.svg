<svg width="900" height="450"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .bus {
        stroke: #666;
        stroke-width: 10;
      }

      .line {
        stroke: #000;
        stroke-width: 3;
      }

      .label {
        font-size: 22px;
        font-family: Arial, sans-serif;
      }

      .small {
        font-size: 18px;
        font-family: Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Bus 1 -->

  <line x1="150" y1="80"
        x2="150" y2="180"
        class="bus"/>

  <!-- Bus 2 -->

  <line x1="450" y1="80"
        x2="450" y2="180"
        class="bus"/>

  <!-- Bus 3 (horisontal) -->

  <line x1="240" y1="290"
        x2="360" y2="290"
        class="bus"/>

  <!-- Linje 1-2 -->

  <line x1="150" y1="130"
        x2="450" y2="130"
        class="line"/>

  <!-- Linje 1-3 -->

  <line x1="150" y1="130"
        x2="300" y2="290"
        class="line"/>

  <!-- Linje 2-3 -->

  <line x1="450" y1="130"
        x2="300" y2="290"
        class="line"/>

  <!-- Linjeimpedanser -->

  <text x="285" y="110"
        class="small">
    z₁₂
  </text>

  <text x="205" y="220"
        class="small">
    z₁₃
  </text>

  <text x="370" y="220"
        class="small">
    z₂₃
  </text>

  <!-- Bus-navn -->

  <text x="115" y="60"
        class="label">
    Bus 1
  </text>

  <text x="415" y="60"
        class="label">
    Bus 2
  </text>

  <text x="260" y="260"
        class="label">
    Bus 3
  </text>

  <!-- Slack-generator -->

  <circle cx="85"
          cy="130"
          r="30"
          fill="none"
          stroke="black"
          stroke-width="2"/>

  <text x="74"
        y="138"
        class="small">
    ~
  </text>

  <line x1="115"
        y1="130"
        x2="150"
        y2="130"
        class="line"/>

  <text x="20"
        y="205"
        class="small">
    Slack bus
  </text>

  <text x="10"
        y="230"
        class="small">
    V₁∠δ₁
  </text>

  <!-- PV-generator -->

  <circle cx="515"
          cy="130"
          r="30"
          fill="none"
          stroke="black"
          stroke-width="2"/>

  <text x="501"
        y="138"
        class="small">
    G
  </text>

  <line x1="450"
        y1="130"
        x2="485"
        y2="130"
        class="line"/>

  <text x="550"
        y="205"
        class="small">
    PV bus
  </text>

  <text x="550"
        y="230"
        class="small">
    P₂, V₂
  </text>

  <!-- PQ-last -->

  <line x1="300"
        y1="290"
        x2="300"
        y2="345"
        class="line"/>

  <polygon points="280,345 320,345 300,385"
           fill="white"
           stroke="black"
           stroke-width="2"/>

  <text x="340"
        y="355"
        class="small">
    PQ bus
  </text>

  <text x="340"
        y="380"
        class="small">
    P₃, Q₃
  </text>

</svg>