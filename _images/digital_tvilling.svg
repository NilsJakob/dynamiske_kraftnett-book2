  </text>

  <text x="30" y="420"
        transform="rotate(-90 30 420)"
        font-size="42"
        font-family="Times New Roman">
    Kompleksitet
  </text>

  <!-- Nivå 1 -->
  <rect x="80" y="550" width="280" height="60"
        fill="#12ADE8" stroke="black"/>
  <text x="220" y="590"
        text-anchor="middle"
        font-size="30">
    Digital modell
  </text>

  <text x="100" y="650"
        font-size="32">
    Representasjon
  </text>

  <!-- Nivå 2 -->
  <rect x="280" y="380" width="320" height="60"
        fill="#12ADE8" stroke="black"/>
  <text x="440" y="420"
        text-anchor="middle"
        font-size="30">
    Delvis integrert
  </text>

  <text x="250" y="500"
        font-size="32">
