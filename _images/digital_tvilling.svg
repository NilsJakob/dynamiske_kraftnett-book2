  </text>

  <!-- Nivå 3 -->
  <rect x="480" y="210" width="300" height="60"
        fill="#12ADE8" stroke="black"/>
  <text x="630" y="250"
        text-anchor="middle"
        font-size="30">
    Fullt integrert
  </text>

  <text x="540" y="330"
