<svg width="900" height="800" xmlns="http://www.w3.org/2000/svg">

  <text x="450" y="70"
        font-size="48"
        text-anchor="middle"
        font-family="Times New Roman">
    Digital tvilling
  </text>

  <!-- Akser -->
  <line x1="80" y1="700" x2="850" y2="700"
        stroke="black" stroke-width="2"/>
  <polygon points="850,700 838,694 838,706"
           fill="black"/>

  <line x1="80" y1="700" x2="80" y2="100"
        stroke="black" stroke-width="2"/>
  <polygon points="80,100 74,112 86,112"
           fill="black"/>

  <!-- Aksetitler -->
  <text x="400" y="760"
        font-size="42"
        font-family="Times New Roman">
