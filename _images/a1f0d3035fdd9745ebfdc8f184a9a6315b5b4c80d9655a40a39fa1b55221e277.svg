<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500">

  <!-- Bus B1 -->
  <line x1="120" y1="120" x2="260" y2="120" stroke="black" stroke-width="3"/>

  <!-- External Grid symbol -->
  <line x1="190" y1="120" x2="190" y2="40" stroke="black" stroke-width="3"/>

  <line x1="190" y1="40" x2="165" y2="5" stroke="black" stroke-width="2"/>
  <line x1="190" y1="40" x2="190" y2="0" stroke="black" stroke-width="2"/>
  <line x1="190" y1="40" x2="215" y2="5" stroke="black" stroke-width="2"/>

  <!-- Cable -->
  <line x1="190" y1="120" x2="190" y2="230" stroke="black" stroke-width="3"/>

  <!-- Bus B2 -->
  <line x1="120" y1="230" x2="260" y2="230" stroke="black" stroke-width="3"/>

  <!-- Transformer -->
  <line x1="190" y1="230" x2="190" y2="260" stroke="black" stroke-width="3"/>

  <circle cx="190" cy="285" r="25" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="190" cy="315" r="25" fill="none" stroke="black" stroke-width="2"/>

  <line x1="190" y1="340" x2="190" y2="390" stroke="black" stroke-width="3"/>

  <!-- Bus B3 -->
  <line x1="120" y1="390" x2="260" y2="390" stroke="black" stroke-width="3"/>

  <!-- Load -->
