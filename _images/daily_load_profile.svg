<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380">
  <style>
    .title { font: bold 22px sans-serif; }
    .label { font: 16px sans-serif; }
    .small { font: 14px monospace; }
    .ts { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .day { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10"
      refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="20" y="35" class="title">
    Fra tidsserie til døgnprofiler
  </text>

  <!-- Tidsserie -->
  <rect x="20" y="70" width="350" height="220" class="ts"/>

  <text x="40" y="100" class="label">
    Timeserie
  </text>

  <text x="40" y="140" class="small">
2026-01-01 00:00   16662
  </text>

  <text x="40" y="170" class="small">
2026-01-01 01:00   14953
  </text>

  <text x="40" y="200" class="small">
...
  </text>

  <text x="40" y="230" class="small">
2026-01-01 23:00   18345
  </text>

  <text x="40" y="260" class="small">
2026-01-02 00:00   17201
  </text>

  <!-- Arrow -->
  <line x1="390" y1="180" x2="520" y2="180" class="arrow"/>

  <text x="410" y="150" class="label">
groupby(date)
  </text>

  <!-- Døgnprofiler -->
  <rect x="550" y="50" width="500" height="260" class="day"/>

  <text x="570" y="80" class="label">
Døgnprofiler
  </text>

  <text x="570" y="130" class="small">
2026-01-01 → [16662, 14953, ..., 18345]
  </text>

  <text x="570" y="180" class="small">
2026-01-02 → [17201, 16512, ..., 18902]
  </text>

  <text x="570" y="230" class="small">
...
  </text>

  <text x="570" y="280" class="small">
2026-05-20 → [15811, 14920, ..., 17650]
  </text>

  <text x="550" y="340" class="label">
Én liste = ett døgn = 24 observasjoner
  </text>
</svg>
