  <!-- Vertikal tekst -->
  <text x="730" y="60" font-family="Times New Roman" font-size="22" font-weight="bold">
    P_grid
  </text>

 <!-- Vertikal tekst -->
  <text x="160" y="60" font-family="Times New Roman" font-size="22" font-weight="bold">
    P_gen
  </text>

</svg>