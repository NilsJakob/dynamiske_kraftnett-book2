<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">

  <style>
    .wire { stroke:black; stroke-width:4; fill:none; }
    .label { font-family:Arial, sans-serif; font-size:18px; }
    .small { font-family:Arial, sans-serif; font-size:15px; }
  </style>

  <!-- ========================= -->
  <!-- PV ARRAY -->
  <!-- ========================= -->

  <circle cx="70" cy="45" r="18" fill="gold"/>

  <rect x="40" y="85" width="90" height="90" fill="#5d87c5" stroke="#333" stroke-width="2"/>

  <line x1="55" y1="85" x2="55" y2="175" stroke="white"/>
  <line x1="75" y1="85" x2="75" y2="175" stroke="white"/>
  <line x1="95" y1="85" x2="95" y2="175" stroke="white"/>
  <line x1="115" y1="85" x2="115" y2="175" stroke="white"/>

  <line x1="40" y1="105" x2="130" y2="105" stroke="white"/>
  <line x1="40" y1="125" x2="130" y2="125" stroke="white"/>
  <line x1="40" y1="145" x2="130" y2="145" stroke="white"/>

  <text x="37" y="215" class="label">PV Array</text>

  <!-- ========================= -->
  <!-- INPUT DC -->
  <!-- ========================= -->

  <line x1="130" y1="110" x2="220" y2="110" class="wire"/>
  <line x1="130" y1="150" x2="220" y2="150" class="wire"/>



  <!-- ========================= -->
  <!-- DC/DC -->
  <!-- ========================= -->

  <rect x="220" y="75" width="120" height="110" rx="12" fill="#466eab" stroke="#25457b" stroke-width="4"/>

  <!-- diagonal -->
  <line x1="245" y1="160" x2="315" y2="90" stroke="white" stroke-width="4"/>

  <!-- upper DC symbol -->
  <line x1="248" y1="98" x2="278" y2="98" stroke="white" stroke-width="5"/>

  <line x1="248" y1="110" x2="278" y2="110" stroke="white" stroke-width="5"/>

  <!-- lower DC symbol -->
  <line x1="282" y1="145" x2="312" y2="145" stroke="white" stroke-width="5"/>

  <line x1="282" y1="157" x2="312" y2="157" stroke="white" stroke-width="5"/>



  <text x="247" y="223" class="label">DC/DC</text>

  <!-- ========================= -->
  <!-- DC LINK -->
  <!-- ========================= -->

  <line x1="340" y1="110" x2="500" y2="110" class="wire"/>

  <line x1="340" y1="150" x2="500" y2="150" class="wire"/>

  <text x="350" y="103" font-size="20" font-weight="bold">+</text>

  <text x="352" y="165" font-size="20" font-weight="bold">−</text>

  <text x="390" y="55" class="label">DC Link</text>

  <text x="400" y="95" class="small" font-style="italic">Vdc</text>

  <!-- capacitor -->
  <line x1="420" y1="110" x2="420" y2="122" stroke="black" stroke-width="3"/>

  <line x1="405" y1="122" x2="435" y2="122" stroke="black" stroke-width="5"/>

  <line x1="405" y1="138" x2="435" y2="138" stroke="black" stroke-width="5"/>

  <line x1="420" y1="138" x2="420" y2="150" stroke="black" stroke-width="3"/>

  <text x="445" y="134" class="small">Cdc</text>

  <!-- ========================= -->
  <!-- VSC INVERTER -->
  <!-- ========================= -->

  <rect x="500" y="75" width="120" height="110" rx="12" fill="#8db1ee" stroke="#5676ab" stroke-width="4"/>

  <!-- diagonal -->
  <line x1="520" y1="165" x2="600" y2="85" stroke="white" stroke-width="4" opacity="0.7"/>

 <!-- DC symbol øverst -->
<line x1="525" y1="100" x2="560" y2="100" stroke="#efe083" stroke-width="5"/>

<line x1="525" y1="113" x2="560" y2="113" stroke="#efe083" stroke-width="5"/>

<!-- AC symbol nederst -->
<text x="570" y="170" font-size="60" text-anchor="middle" fill="#ffd0a0">~</text>

  <text x="532" y="223" class="label">VSC</text>

  <!-- ========================= -->
  <!-- FILTER -->
  <!-- ========================= -->

  <line x1="620" y1="130" x2="655" y2="130" class="wire"/>

  <path d="       M655 130       q10 -15 20 0       q10 -15 20 0       q10 -15 20 0" stroke="black" stroke-width="3" fill="none"/>

  <line x1="715" y1="130" x2="760" y2="130" class="wire"/>

  <text x="675" y="105" class="small">L</text>

  <!-- ========================= -->
  <!-- GRID -->
  <!-- ========================= -->

  <line x1="780" y1="70" x2="780" y2="190" stroke="black" stroke-width="5"/>

  <line x1="760" y1="105" x2="840" y2="105" stroke="red" stroke-width="4"/>

  <line x1="760" y1="130" x2="840" y2="130" stroke="gold" stroke-width="4"/>

  <line x1="760" y1="155" x2="840" y2="155" stroke="blue" stroke-width="4"/>

  <text x="800" y="220" class="label">Grid</text>

</svg>