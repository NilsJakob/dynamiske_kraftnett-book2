<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700">

  <style>
    .grid { stroke:#666; stroke-width:2; fill:none; }
    .target { stroke:#666; stroke-width:3; fill:none; }
    .hit { stroke:#3cbf4a; stroke-width:3; }
    .label { font-family:Arial,sans-serif; fill:#333; }
    .title { font-size:30px; }
    .side { font-size:28px; }
  </style>

  <!-- Grid -->
  <rect x="20" y="20" width="760" height="640" class="grid"/>
  <line x1="180" y1="20" x2="180" y2="660" class="grid"/>
  <line x1="440" y1="20" x2="440" y2="660" class="grid"/>
  <line x1="20" y1="140" x2="780" y2="140" class="grid"/>
  <line x1="20" y1="400" x2="780" y2="400" class="grid"/>

  <!-- Column headers -->
  <text x="310" y="70" text-anchor="middle" class="label title">Low</text>
  <text x="310" y="110" text-anchor="middle" class="label title">Variance</text>

  <text x="610" y="70" text-anchor="middle" class="label title">High</text>
  <text x="610" y="110" text-anchor="middle" class="label title">Variance</text>

  <!-- Row headers -->
  <text x="100" y="260" text-anchor="middle" class="label side">Low</text>
  <text x="100" y="300" text-anchor="middle" class="label side">Bias</text>

  <text x="100" y="520" text-anchor="middle" class="label side">High</text>
  <text x="100" y="560" text-anchor="middle" class="label side">Bias</text>

  <!-- Low Bias / Low Variance -->
  <g>
    <circle cx="310" cy="270" r="55" class="target"/>
    <circle cx="310" cy="270" r="20" class="target"/>

    <g class="hit">
      <line x1="294" y1="254" x2="306" y2="266"/>
      <line x1="306" y1="254" x2="294" y2="266"/>

      <line x1="314" y1="252" x2="326" y2="264"/>
      <line x1="326" y1="252" x2="314" y2="264"/>

      <line x1="304" y1="270" x2="316" y2="282"/>
      <line x1="316" y1="270" x2="304" y2="282"/>

      <line x1="317" y1="262" x2="329" y2="274"/>
      <line x1="329" y1="262" x2="317" y2="274"/>
    </g>
  </g>

  <!-- Low Bias / High Variance -->
  <g>
    <circle cx="570" cy="270" r="55" class="target"/>
    <circle cx="570" cy="270" r="20" class="target"/>

    <g class="hit">
      <text x="523" y="255">×</text>
      <text x="575" y="235">×</text>
      <text x="610" y="255">×</text>
      <text x="520" y="305">×</text>
      <text x="605" y="310">×</text>
      <text x="560" y="330">×</text>
      <text x="560" y="275">×</text>
    </g>
  </g>

  <!-- High Bias / Low Variance -->
  <g>
    <circle cx="310" cy="530" r="55" class="target"/>
    <circle cx="310" cy="530" r="20" class="target"/>
    <circle cx="310" cy="530" r="4" fill="#666"/>

    <g class="hit">
      <text x="375" y="515">×</text>
      <text x="388" y="525">×</text>
      <text x="382" y="540">×</text>
      <text x="370" y="530">×</text>
    </g>
  </g>

  <!-- High Bias / High Variance -->
  <g>
    <circle cx="570" cy="530" r="55" class="target"/>
    <circle cx="570" cy="530" r="20" class="target"/>
    <circle cx="570" cy="530" r="4" fill="#666"/>

    <g class="hit">
      <text x="650" y="475">×</text>
      <text x="680" y="455">×</text>
      <text x="705" y="495">×</text>
      <text x="665" y="525">×</text>
      <text x="710" y="540">×</text>
      <text x="690" y="570">×</text>
    </g>
  </g>

</svg>