<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450">
  <style>
    .title { font: bold 22px sans-serif; }
    .label { font: 16px sans-serif; }
    .small { font: 14px monospace; }
    .box { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .series { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .matrix { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="20" y="35" class="title">
    Fra døgnprofiler til matrise med np.vstack()
  </text>

  <!-- daily -->
  <rect x="20" y="70" width="370" height="260" class="series"/>

  <text x="40" y="100" class="label">daily (Pandas Series)</text>

  <text x="40" y="140" class="small">
2026-01-01 → [x₁, x₂, ..., x₂₄]
  </text>

  <text x="40" y="180" class="small">
2026-01-02 → [x₁, x₂, ..., x₂₄]
  </text>

  <text x="40" y="220" class="small">
...
  </text>

  <text x="40" y="260" class="small">
2026-05-20 → [x₁, x₂, ..., x₂₄]
  </text>

  <!-- values -->
  <line x1="410" y1="165" x2="540" y2="165" class="arrow"/>

  <text x="430" y="140" class="label">
daily.values
  </text>

  <rect x="560" y="80" width="220" height="210" class="box"/>

  <text x="580" y="110" class="label">Liste av lister</text>

  <text x="580" y="150" class="small">
[
  </text>

  <text x="600" y="180" class="small">
[x₁,...,x₂₄],
  </text>

  <text x="600" y="210" class="small">
[x₁,...,x₂₄],
  </text>

  <text x="600" y="240" class="small">
...
  </text>

  <text x="580" y="270" class="small">
]
  </text>

  <!-- vstack -->
  <line x1="800" y1="165" x2="910" y2="165" class="arrow"/>

  <text x="815" y="140" class="label">
np.vstack()
  </text>

  <!-- matrix -->
  <rect x="930" y="70" width="140" height="230" class="matrix"/>

  <line x1="930" y1="115" x2="1070" y2="115" stroke="#d97706"/>
  <line x1="930" y1="160" x2="1070" y2="160" stroke="#d97706"/>
  <line x1="930" y1="205" x2="1070" y2="205" stroke="#d97706"/>
  <line x1="930" y1="250" x2="1070" y2="250" stroke="#d97706"/>

  <text x="950" y="100" class="small">Dag 1</text>
  <text x="950" y="145" class="small">Dag 2</text>
  <text x="950" y="190" class="small">...</text>
  <text x="950" y="235" class="small">Dag n</text>

  <text x="860" y="350" class="label">
Shape = (antall_dager, 24)
  </text>

</svg>